{{- if and .Values.externalSecret .Values.externalSecret.enabled }}
{{- $targetName := .Values.externalSecret.target.name | default (printf "%s-secret" (include "deploy.fullname" .)) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.name | default (printf "%s-kv" (include "deploy.fullname" .)) }}
  labels:
    {{- include "deploy.labels" . | nindent 4 }}
    {{- with .Values.externalSecret.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.externalSecret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "24h" | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecret.secretStoreRef.name | default "vault-backend" }}
  target:
    name: {{ $targetName }}
    creationPolicy: {{ .Values.externalSecret.target.creationPolicy | default "Owner" }}
    deletionPolicy: {{ .Values.externalSecret.target.deletionPolicy | default "Retain" }}
    {{- with .Values.externalSecret.target.template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- if .Values.externalSecret.dataFrom }}
  dataFrom:
    {{- toYaml .Values.externalSecret.dataFrom | nindent 4 }}
  {{- end }}
  {{- if .Values.externalSecret.data }}
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.externalSecrets }}
{{- $root := . }}
{{- range $index, $es := .Values.externalSecrets }}
{{- if default true $es.enabled }}
{{- $esTargetName := $es.target.name | default (printf "%s-%s-secret" (include "deploy.fullname" $root) ($es.name | default (printf "es-%d" $index))) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ default (printf "%s-%s-kv" (include "deploy.fullname" $root) ($es.name | default (printf "es-%d" $index))) $es.fullnameOverride }}
  labels:
    {{- include "deploy.labels" $root | nindent 4 }}
    {{- with $es.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $es.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ $es.refreshInterval | default "24h" | quote }}
  secretStoreRef:
    kind: {{ (and $es.secretStoreRef $es.secretStoreRef.kind) | default "ClusterSecretStore" }}
    name: {{ (and $es.secretStoreRef $es.secretStoreRef.name) | default "vault-backend" }}
  target:
    name: {{ $esTargetName }}
    creationPolicy: {{ (and $es.target $es.target.creationPolicy) | default "Owner" }}
    deletionPolicy: {{ (and $es.target $es.target.deletionPolicy) | default "Retain" }}
    {{- if and $es.target $es.target.template }}
    template:
      {{- toYaml $es.target.template | nindent 6 }}
    {{- end }}
  {{- if $es.dataFrom }}
  dataFrom:
    {{- toYaml $es.dataFrom | nindent 4 }}
  {{- end }}
  {{- if $es.data }}
  data:
    {{- toYaml $es.data | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
