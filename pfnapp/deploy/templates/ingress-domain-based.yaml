{{- if .Values.ingressDomains }}
{{- $fullName := include "deploy.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- range .Values.ingressDomains }}
{{- if .enabled }}
---
{{- $domainName := .host | replace "." "-" | replace "*" "wildcard" }}
{{- if and .className (not (hasKey .annotations "kubernetes.io/ingress.class")) }}
  {{- $_ := set .annotations "kubernetes.io/ingress.class" .className}}
{{- end }}
{{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" $.Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ printf "%s-%s" $fullName $domainName | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "deploy.labels" $ | nindent 4 }}
    domain: {{ .host | quote }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .className (semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .className }}
  {{- end }}
  {{- if .tls }}
  tls:
    - hosts:
        - {{ .host | quote }}
      secretName: {{ .tlsSecret | default (printf "%s-%s-tls" $fullName $domainName) }}
  {{- end }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if and .pathType (semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion) }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              {{- $targetServiceName := .serviceName | default .service_name | default $fullName }}
              {{- $targetServicePort := .servicePort | default .service_port | default .port | default $svcPort }}
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ $targetServiceName }}
                port:
                  {{- if or (typeIs "string" $targetServicePort) (typeIs "int" $targetServicePort) (typeIs "float64" $targetServicePort) }}
                    {{- if regexMatch "^[0-9]+$" (toString $targetServicePort) }}
                  number: {{ $targetServicePort }}
                    {{- else }}
                  name: {{ $targetServicePort }}
                    {{- end }}
                  {{- else }}
                  number: {{ $targetServicePort }}
                  {{- end }}
              {{- else }}
              serviceName: {{ $targetServiceName }}
              servicePort: {{ $targetServicePort }}
              {{- end }}
          {{- end }}
{{- end }}
{{- end }}
{{- end }}