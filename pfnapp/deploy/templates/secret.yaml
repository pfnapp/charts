{{- if .Values.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secret" (include "deploy.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "deploy.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value }}
  {{- end }}
{{- end }}